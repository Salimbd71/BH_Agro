<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BH Agro Ltd. - Animal Health ERP & SR Management</title>
  <meta name="description" content="Comprehensive Animal Health Products ERP, SR Order Booking, Inventory & Sales Analytics for BH Agro Ltd." />
  <meta property="og:title" content="BH Agro Ltd. - Animal Health ERP" />
  <meta property="og:description" content="Veterinary Pharmaceuticals & Animal Nutrition order management system." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Google Fonts: Inter & Hind Siliguri for beautiful Bengali & English typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22',
            },
            tealbrand: {
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            }
          },
          fontFamily: {
            sans: ['"Hind Siliguri"', 'Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (xlsx.full.min.js) for Excel export & bulk product upload -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- html2pdf.js for high-fidelity client-side PDF Invoice generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Firebase JavaScript SDK v10 (Compat version for reliable standalone CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.6);
    }
    .print-only {
      display: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printableInvoice, #printableInvoice * {
        visibility: visible;
      }
      #printableInvoice {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

  <!-- Main Application Wrapper -->
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Dynamic Content Rendered Here via /src/main.ts -->
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

  <!-- Hidden PDF Generation Sandbox -->
  <div id="pdfInvoiceSandbox" class="fixed -left-[9999px] top-0 bg-white text-slate-900 w-[794px] p-8 shadow-2xl font-sans"></div>

  <!-- Modular Application Entry Point -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
